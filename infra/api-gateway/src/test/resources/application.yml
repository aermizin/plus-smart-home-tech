spring:
  config:
    import: ""

  cloud:
    config:
      enabled: false

    discovery:
      enabled: false

    gateway:
      routes:
        - id: test-products
          uri: forward:/test-backend
          predicates:
            - Path=/api/products/**
        - id: test-categories
          uri: forward:/test-backend
          predicates:
            - Path=/api/categories/**
        - id: test-orders
          uri: forward:/test-backend
          predicates:
            - Path=/api/orders/**
app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false