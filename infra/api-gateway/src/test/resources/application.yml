spring:
  config:
    import: ""

  cloud:
    config:
      enabled: false

    discovery:
      enabled: false

    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600

      routes:
        - id: test-products
          uri: forward:/test-backend
          predicates:
            - Path=/api/products/**
        - id: test-categories
          uri: forward:/test-backend
          predicates:
            - Path=/api/categories/**
        - id: test-orders
          uri: forward:/test-backend
          predicates:
            - Path=/api/orders/**
app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false