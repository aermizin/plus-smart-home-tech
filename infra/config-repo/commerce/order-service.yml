server:
  port: 0

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: 12345

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            loggerLevel: basic
            connectTimeout: 1000
            readTimeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - ru.yandex.practicum.order.exception.BusinessException
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
        cancel-running-future: true

logging:
  file:
    name: logs/order-service.log
  level:
    org.hibernate.SQL: DEBUG
    liquibase: DEBUG
    ru.yandex.practicum.order.feign: DEBUG
