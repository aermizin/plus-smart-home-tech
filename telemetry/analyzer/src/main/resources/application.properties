spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.topic.snapshots-topic=telemetry.snapshots.v1
spring.kafka.topic.hub-events-topic=telemetry.hubs.v1

spring.kafka.consumer.snapshot.group-id=analyzer-snapshot-group
spring.kafka.consumer.snapshot.poll-timeout-ms=500
spring.kafka.consumer.snapshot.enable-auto-commit=false
spring.kafka.consumer.snapshot.auto-offset-reset=earliest

spring.kafka.consumer.hub-event.group-id=analyzer-hub-event-group
spring.kafka.consumer.hub-event.poll-timeout-ms=3000
spring.kafka.consumer.hub-event.enable-auto-commit=false
spring.kafka.consumer.hub-event.auto-offset-reset=earliest

spring.kafka.close-timeout-seconds=30
spring.kafka.retries=3

grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.negotiationType=plaintext
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true

spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false