analyzer.kafka.bootstrap-servers=localhost:9092

analyzer.kafka.topic.snapshots-topic=telemetry.snapshots.v1
analyzer.kafka.topic.hub-events-topic=telemetry.hubs.v1

analyzer.kafka.consumer.snapshot.group-id=analyzer-snapshot-group
analyzer.kafka.consumer.snapshot.poll-timeout-ms=500
analyzer.kafka.consumer.snapshot.enable-auto-commit=false
analyzer.kafka.consumer.snapshot.auto-offset-reset=earliest

analyzer.kafka.consumer.hub-event.group-id=analyzer-hub-event-group
analyzer.kafka.consumer.hub-event.poll-timeout-ms=3000
analyzer.kafka.consumer.hub-event.enable-auto-commit=false
analyzer.kafka.consumer.hub-event.auto-offset-reset=earliest

grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.negotiationType=plaintext
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true

spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE